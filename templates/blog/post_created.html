{% extends "base.html" %} 

{% block title %} New Post {% endblock %} 

{% block content %}

<h1>Write a new post</h1>

 <form method="post" enctype="multipart/form-data">
        {% csrf_token %} {% for field in form %}

        <div>
            {{ field.label_tag }} 
            {{ field }} 
            {% if field.help_text %}

            <small>{{ field.help_text}} </small>

        {% endif %} {{field.errors }}
    </div>
    
        {% endfor %} ,
        
    <button type="submit">Create a Post</button>

  </form>


{% endblock %}
